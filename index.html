    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link href="./output.css" rel="stylesheet" />

    <title>Frontend Mentor | Social links profile</title>

  <body
    class="font-inter text-sm bg-grey-900 text-white min-h-screen flex justify-center items-center px-5 py-8"
  >
    <main
      class="bg-grey-800 p-6 md:p-10 w-full max-w-xs md:max-w-sm rounded-xl"
    >
      <img
        src="./assets/images/avatar-jessica.jpeg"
        alt="Profile photo of Jessica Randall"
        class="size-22 rounded-full m-auto mb-6"
      />
      <h1 class="text-center text-2xl font-semibold mb-1">Jessica Randall</h1>
      <h2 class="text-center text-green font-bold mb-6">
        London, United Kingdom
      </h2>
      <h3 class="text-center mb-6">"Front-end developer and avid reader."</h3>

      <div class="flex flex-col items-stretch gap-4">
        <a
          class="py-3 bg-grey-700 text-center font-bold rounded-lg hover:bg-green hover:text-grey-700 cursor-pointer"
          >GitHub</a
        >
        <a
          class="py-3 bg-grey-700 text-center font-bold rounded-lg hover:bg-green hover:text-grey-700 cursor-pointer"
          >Frontend Mentor</a
        >
        <a
          class="py-3 bg-grey-700 text-center font-bold rounded-lg hover:bg-green hover:text-grey-700 cursor-pointer"
          >LinkedIn</a
        >
        <a
          class="py-3 bg-grey-700 text-center font-bold rounded-lg hover:bg-green hover:text-grey-700 cursor-pointer"
          >Twitter</a
        >
        <a
          class="py-3 bg-grey-700 text-center font-bold rounded-lg hover:bg-green hover:text-grey-700 cursor-pointer"
          >Instagram</a
        >
      </div>
    </main>
